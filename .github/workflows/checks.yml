name: Checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install
        run: bun install --frozen-lockfile

      # One step, one command: the same wrapper `AGENTS.md` declares under
      # "Verify before pushing". Do not spell the steps out here — if this
      # sequence and the wrapper ever differ, this file is the bug.
      - name: Check
        run: bun run verify
